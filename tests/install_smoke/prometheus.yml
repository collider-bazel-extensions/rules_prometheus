# prometheus_install smoke config: scrape itself as job `smoke-self`,
# load smoke.rules.yml (mounted beside this file at /etc/config).
global:
  scrape_interval: 2s
  evaluation_interval: 2s
rule_files:
  - "*.rules.yml"
scrape_configs:
  - job_name: smoke-self
    static_configs:
      - targets: ["127.0.0.1:9090"]
