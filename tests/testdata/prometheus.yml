# Test config: self-scrape, runtime targets (file_sd), and an `app` job
# whose target comes from a custom placeholder (APP_TARGET; api_test sets
# it to a closed port so InstanceDown fires).
global:
  scrape_interval: 1s
  evaluation_interval: 1s
rule_files:
  - "*.rules.yml"
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["${PROMETHEUS_ADDRESS}"]
  - job_name: app
    static_configs:
      - targets: ["${APP_TARGET}"]
  - job_name: file_sd
    # Ad-hoc test exporters often send no Content-Type (Prometheus 3
    # refuses those without a fallback).
    fallback_scrape_protocol: PrometheusText0.0.4
    file_sd_configs:
      - files: ["${PROMETHEUS_FILE_SD_DIR}/*.json"]
        refresh_interval: 1s
